# Render.com Deployment Blueprint
# https://docs.render.com/infrastructure-as-code
services:
  - type: web
    name: stemations
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://stemations.onrender.com
      - key: MAX_OUTPUT_AGE_HOURS
        value: "6"
    healthCheckPath: /api/health
